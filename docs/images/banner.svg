<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B579A"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Icon: an agent input box with a draft, and a save badge -->
  <g transform="translate(50, 55)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="url(#glow)" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <line x1="10" y1="16" x2="110" y2="16" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <text x="12" y="38" font-family="monospace" font-size="15" fill="#ffffff" opacity="0.9">❯</text>
    <rect x="28" y="29" width="62" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>
    <rect x="28" y="43" width="48" height="5" rx="2.5" fill="#ffffff" opacity="0.45"/>
    <rect x="80" y="41" width="2" height="10" fill="#ffffff" opacity="0.9"/>
    <line x1="10" y1="64" x2="110" y2="64" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <!-- Save badge -->
    <g transform="translate(92, 52)">
      <rect x="0" y="0" width="34" height="34" rx="5" fill="#ffffff"/>
      <rect x="7" y="4" width="18" height="10" rx="1" fill="#2B579A"/>
      <rect x="19" y="6" width="4" height="6" fill="#ffffff"/>
      <rect x="6" y="19" width="22" height="11" rx="1.5" fill="#2B579A" opacity="0.85"/>
    </g>
  </g>

  <!-- Title -->
  <text x="212" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-1">
    unsent
  </text>

  <!-- Subtitle -->
  <text x="214" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.65" letter-spacing="0.3">
    AutoRecover for your AI agent prompts
  </text>

  <!-- Decorative: saved draft versions on the right -->
  <g transform="translate(730, 48)">
    <rect x="0" y="0" width="120" height="22" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="10" y="8" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="0" y="36" width="120" height="22" rx="5" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="10" y="44" width="88" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="0" y="72" width="120" height="22" rx="5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="10" y="80" width="100" height="6" rx="3" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>
