name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The shell tests run the hooks in a real zsh; the Linux runner has none.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: go vet ./...
      # The race detector slows the stitcher's fuzz several times over, so
      # the race run skips it and a second run holds the full fuzz. Each
      # test runs once; the two coverage profiles add up to the whole suite.
      - run: go test -race -count=1 -skip Fuzz -coverprofile=coverage-race.out ./...
      - run: go test -count=1 -run Fuzz -coverprofile=coverage-fuzz.out ./...
        env:
          UNSENT_FUZZ_SEEDS: "50"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage-race.out,coverage-fuzz.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # `goreleaser check` exits 2 on the deprecated `brews` block and misses
  # broken templates, so run the release itself in snapshot mode: it builds,
  # archives and renders the formula templates, and publishes nothing. With
  # no TAP_GITHUB_TOKEN here, a template mistake fails this job instead of a
  # tag push, after the GitHub release already exists.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - run: test -s dist/homebrew/Formula/unsent.rb
