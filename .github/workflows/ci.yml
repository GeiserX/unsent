name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The race detector slows the stitcher's fuzz several times over, so
      # the race run skips it and a second run holds the full fuzz. Each
      # test runs once; the two coverage profiles add up to the whole suite.
      - run: go test -race -count=1 -skip Fuzz -coverprofile=coverage-race.out ./...
      - run: go test -count=1 -run Fuzz -coverprofile=coverage-fuzz.out ./...
        env:
          UNSENT_FUZZ_SEEDS: "50"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage-race.out,coverage-fuzz.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
