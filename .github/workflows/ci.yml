name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Three suites, each a job of its own, so the run takes as long as
        # the slowest one rather than the sum.
        #
        # race holds the whole suite but the stitcher's fuzz, which the race
        # detector slows several times over; fuzz holds the fuzz alone, its
        # twelve runs in parallel.
        #
        # Only cover measures coverage, and it is the one job that runs
        # neither in parallel nor under the detector. Coverage counters are
        # written by the code under test, so concurrency makes several cores
        # write the same counters, and the detector instruments every write.
        # Both are measured, on the Mac mini and on this runner:
        #
        #   race, with -coverprofile          292 s against 199 s without
        #   fuzz in parallel, with            367 s of CPU against 232 s
        #   the Linux fuzz job, with          9m27s against 4m01s on macOS
        #
        # Coverage costs nothing in a run that is sequential and detector-
        # free, which is what cover is. It runs the same tests as race, adds
        # no check of its own, and is a Linux job alone since only Linux
        # uploads. Every test still runs under -race on both systems.
        suite: [race, fuzz, cover]
        exclude:
          - os: macos-latest
            suite: cover
    name: test (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The shell tests run the hooks in a real zsh; the Linux runner has none.
      - if: runner.os == 'Linux' && matrix.suite != 'fuzz'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - if: matrix.suite == 'race'
        run: go vet ./...
      - if: matrix.suite == 'race'
        run: go test -race -count=1 -skip Fuzz ./...
      - if: matrix.suite == 'fuzz'
        run: go test -count=1 -run Fuzz ./...
        env:
          UNSENT_FUZZ_SEEDS: "50"
      - if: matrix.suite == 'cover'
        run: go test -count=1 -skip Fuzz -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.suite == 'cover'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: ${{ matrix.suite }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # `goreleaser check` exits 2 on the deprecated `brews` block and misses
  # broken templates, so run the release itself in snapshot mode: it builds,
  # archives and renders the formula templates, and publishes nothing. With
  # no TAP_GITHUB_TOKEN here, a template mistake fails this job instead of a
  # tag push, after the GitHub release already exists.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - run: test -s dist/homebrew/Formula/unsent.rb
