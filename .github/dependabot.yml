version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels: ["dependencies", "automated"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: ["ci", "automated"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
