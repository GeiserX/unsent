codecov:
  require_ci_to_pass: true
  # CI uploads twice per commit, the race run and the fuzz run: report on
  # their sum, never on one alone.
  notify:
    after_n_builds: 2

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 90%
        threshold: 5%

comment:
  after_n_builds: 2
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

ignore:
  - "vendor/**"
  - "**/*_test.go"
  - "**/testdata/**"
  - "**/mocks/**"
  - "**/mock_*.go"
