codecov:
  require_ci_to_pass: true
  # One upload a commit, from the cover job, which runs every test but the
  # fuzz; the one branch only the fuzz used to reach has a test of its own
  # now (TestStitchBackspaceOnTheTopRowDeletesWhatIsAboveIt).
  notify:
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 90%
        threshold: 5%

comment:
  after_n_builds: 1
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

ignore:
  - "vendor/**"
  - "**/*_test.go"
  - "**/testdata/**"
  - "**/mocks/**"
  - "**/mock_*.go"
